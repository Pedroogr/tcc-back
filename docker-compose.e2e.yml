services:
  postgres-e2e:
    image: postgres:16
    container_name: cattle_auction_e2e_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cattle_auction_e2e
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cattle_auction_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
