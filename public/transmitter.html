<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transmissor</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    video { width: 720px; max-width: 100%; background: black; border-radius: 12px; display: block; margin-top: 16px; }
    button { padding: 10px 16px; cursor: pointer; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Transmissor</h1>
  <button id="startBtn">Iniciar transmissão</button>
  <p id="status">Aguardando...</p>
  <video id="localVideo" autoplay playsinline muted></video>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    const room = new URLSearchParams(window.location.search).get('room') || 'demo';
    const socket = io();

    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const localVideo = document.getElementById('localVideo');

    let localStream = null;
    let started = false;

    // Uma conexão por viewer
    const peerConnections = {};

    function createPeerConnection(viewerId) {
      const pc = new RTCPeerConnection();

      localStream.getTracks().forEach(track => {
        pc.addTrack(track, localStream);
      });

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', {
            targetId: viewerId,
            senderId: socket.id,
            candidate: event.candidate,
          });
        }
      };

      peerConnections[viewerId] = pc;
      return pc;
    }

    startBtn.addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        localVideo.srcObject = localStream;
        socket.emit('join-room', { room, role: 'transmitter' });
        started = true;
        status.textContent = 'Transmissão iniciada. Aguardando espectadores...';
      } catch (error) {
        console.error(error);
        status.textContent = 'Erro ao acessar câmera: ' + error.message;
      }
    });

    socket.on('viewer-ready', async ({ viewerId }) => {
      try {
        if (!started || !localStream) return;

        status.textContent = `Viewer ${viewerId} entrou. Criando conexão...`;

        const pc = createPeerConnection(viewerId);

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        socket.emit('offer', {
          targetId: viewerId,
          senderId: socket.id,
          sdp: offer,
        });

        status.textContent = `Offer enviada para viewer ${viewerId}`;
      } catch (error) {
        console.error(error);
        status.textContent = 'Erro ao criar offer: ' + error.message;
      }
    });

    socket.on('answer', async ({ senderId, sdp }) => {
      try {
        const pc = peerConnections[senderId];
        if (!pc) return;

        await pc.setRemoteDescription(sdp);
        status.textContent = `Conexão estabelecida com ${senderId}`;
      } catch (error) {
        console.error(error);
        status.textContent = 'Erro ao receber answer: ' + error.message;
      }
    });

    socket.on('ice-candidate', async ({ senderId, candidate }) => {
      try {
        const pc = peerConnections[senderId];
        if (!pc) return;

        await pc.addIceCandidate(candidate);
      } catch (error) {
        console.error('Erro ao adicionar ICE candidate no transmissor:', error);
      }
    });
  </script>
</body>
</html>
